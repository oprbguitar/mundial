name: Set semifinals as default view

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/set-semis-default.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set Semis as the initial and blinking tab
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/main.tsx')
          content = path.read_text(encoding='utf-8')
          default_old = "const [activeStage,setActiveStage]=useState<KnockoutStage|'finals'>('r16')"
          blink_old = "stage.key==='r16'?'attention-blink':''"

          if default_old not in content:
              raise SystemExit('Expected initial-stage expression was not found')
          if blink_old not in content:
              raise SystemExit('Expected blinking-tab expression was not found')

          content = content.replace(
              default_old,
              "const [activeStage,setActiveStage]=useState<KnockoutStage|'finals'>('sf')",
              1,
          )
          content = content.replace(
              blink_old,
              "stage.key==='sf'?'attention-blink':''",
              1,
          )
          path.write_text(content, encoding='utf-8')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Commit verified change and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.tsx
          git rm .github/workflows/set-semis-default.yml
          git commit -m "Open semifinals by default"
          git push
