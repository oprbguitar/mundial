<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">España campeona del Mundial 2026</title>
  <desc id="desc">España venció 1-0 a Argentina en tiempo extra y se proclamó campeona del Mundial 2026.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f0209"/>
      <stop offset="0.48" stop-color="#a60e1e"/>
      <stop offset="1" stop-color="#00163f"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="16%" r="70%">
      <stop offset="0" stop-color="#ffd86b" stop-opacity="0.68"/>
      <stop offset="0.44" stop-color="#ffd86b" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffd86b" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <circle cx="1034" cy="120" r="165" fill="#ffffff" opacity="0.05"/>
  <path d="M0 505 C210 430 390 560 592 496 C816 426 982 456 1200 520 L1200 630 L0 630 Z" fill="#ffffff" opacity="0.07"/>

  <g filter="url(#shadow)">
    <rect x="70" y="68" width="1060" height="494" rx="38" fill="#07183a" opacity="0.9" stroke="#ffd86b" stroke-opacity="0.8" stroke-width="3"/>
  </g>

  <g transform="translate(105 103)">
    <rect x="0" y="0" width="124" height="124" rx="26" fill="#2d050a" stroke="#ffd86b" stroke-width="3"/>
    <text x="62" y="83" text-anchor="middle" font-size="66" font-family="Arial, Helvetica, sans-serif">🏆</text>
  </g>

  <text x="260" y="145" fill="#ffe69a" font-size="26" font-weight="800" font-family="Arial, Helvetica, sans-serif" letter-spacing="5">CAMPEONA DEL MUNDO 2026</text>
  <text x="105" y="316" fill="#ffffff" font-size="112" font-weight="900" font-family="Arial, Helvetica, sans-serif" letter-spacing="3">ESPAÑA</text>
  <text x="105" y="382" fill="#dce8ff" font-size="38" font-weight="700" font-family="Arial, Helvetica, sans-serif">España 1–0 Argentina · Tiempo extra</text>
  <text x="105" y="432" fill="#ffd86b" font-size="27" font-weight="700" font-family="Arial, Helvetica, sans-serif">Ferran Torres · 106′</text>

  <g transform="translate(874 252)" filter="url(#shadow)">
    <rect x="0" y="0" width="210" height="132" rx="18" fill="#aa151b" stroke="#ffffff" stroke-width="5"/>
    <rect x="0" y="34" width="210" height="64" fill="#f1bf00"/>
    <circle cx="58" cy="66" r="18" fill="#aa151b" opacity="0.92"/>
  </g>

  <g transform="translate(105 474)">
    <rect x="0" y="0" width="278" height="54" rx="27" fill="#ffd86b"/>
    <text x="139" y="36" text-anchor="middle" fill="#08183b" font-size="23" font-weight="900" font-family="Arial, Helvetica, sans-serif">VER CUADRO FINAL</text>
  </g>

  <text x="1090" y="524" text-anchor="end" fill="#b9c9ed" font-size="21" font-family="Arial, Helvetica, sans-serif">oprbguitar.github.io/mundial</text>
</svg>
